<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Puffs Bramalea - Display</title>
    <style>
        :root {
            --primary: #ff6600;
            --dark: #111111;
            --white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }

        body {
            background-color: var(--dark);
            color: var(--white);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Slideshow Container - Auto Adjusts */
        .slideshow-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            width: 100%;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in-out, transform 9s linear;
            /* contain ensures the whole poster is always visible regardless of screen shape */
            object-fit: contain; 
            transform: scale(1);
        }

        .slide.active {
            opacity: 1;
            transform: scale(1.08); /* Reduced zoom slightly for better fit */
        }

        /* Bottom QR Action Bar - Responsive Flex */
        .bottom-bar {
            background: rgba(0, 0, 0, 0.95);
            border-top: 3px solid var(--primary);
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 160px;
            z-index: 10;
            flex-wrap: wrap; /* Allows cards to wrap on small screens */
            gap: 15px;
        }

        .qr-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 102, 0, 0.3);
            flex: 1;
            min-width: 280px; /* Prevents cards from getting too squished */
            max-width: 400px;
        }

        .qr-item img {
            width: clamp(70px, 10vw, 100px); /* Adjusts size based on screen width */
            height: auto;
            background: white;
            padding: 5px;
            border-radius: 5px;
            flex-shrink: 0;
        }

        .qr-info {
            text-align: left;
            overflow: hidden;
        }

        .qr-info h2 {
            font-size: clamp(0.9rem, 1.5vw, 1.1rem);
            color: var(--primary);
            margin-bottom: 3px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .qr-info p {
            font-size: clamp(0.75rem, 1.2vw, 0.9rem);
            color: #ccc;
            margin-bottom: 5px;
        }

        .click-btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .vip-item {
            border: 2px solid var(--white);
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.4);
        }

        /* Responsive Mobile Tweak */
        @media (max-height: 600px) {
            .bottom-bar { min-height: 120px; padding: 5px; }
            .qr-item { padding: 5px 10px; }
            .qr-item img { width: 60px; }
        }
    </style>
</head>
<body> 

    <div class="slideshow-container" id="slideshow">     
   
     <!-- Fallback image: only shown if offers.json can't be loaded -->
     <img class="slide active" src="https://github.com/Mr-Puffs-Bramalea/Offer-Images/blob/main/1794414559387.jpg?raw=true">
    
    

 </div>

    <div class="bottom-bar">
        <div class="qr-item vip-item">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://kspatel45.github.io/Mr-Puffs-Bramalea/" alt="Spin QR">
            <div class="qr-info">
                <h2>🔥 Spin & Win</h2>
                <p>Unlock Extra Offers</p>
                <a href="https://kspatel45.github.io/Mr-Puffs-Bramalea/" class="click-btn">Click to Spin</a>
            </div>
        </div>

        <div class="qr-item">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://www.instagram.com/mrpuffs_brampton_bramalea?stkn=dnVjbHVwbTU3cGU=" alt="IG QR">
            <div class="qr-info">
                <h2>Follow Us</h2>
                <p>@mrpuffsbramalea</p>
            </div>
        </div>

        <div class="qr-item">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://g.page/r/CSkej4uUpvmXEAE/review" alt="Review QR">
            <div class="qr-info">
                <h2>Rate Us</h2>
                <p>Leave a 5-Star Review</p>
            </div>
        </div>
    </div>

    <script>
        /* Images come from offers.json in the Offer-Images repo (managed with admin.html).
           This screen shows images whose name ends in "P". */
        const SCREEN_TYPE = 'P';
        const OFFERS_URL = 'https://raw.githubusercontent.com/Mr-Puffs-Bramalea/Offer-Images/main/offers.json';
        const CHECK_EVERY = 5 * 60 * 1000;   // look for new offers every 5 minutes
        const intervalTime = 9000;           // each slide shows for 9 seconds

        let slides = [], currentSlide = 0, liveVersion = null, timer = null;

        async function fetchOffers() {
            try {
                const r = await fetch(OFFERS_URL + '?t=' + Date.now(), { cache: 'no-store' });
                if (!r.ok) throw new Error(r.status);
                const data = await r.json();
                try { localStorage.setItem('mp_offers', JSON.stringify(data)); } catch (e) {}
                return data;
            } catch (e) {
                try { return JSON.parse(localStorage.getItem('mp_offers')); } catch (e2) { return null; }
            }
        }

        function buildSlides(data) {
            const box = document.getElementById('slideshow');
            const list = data && data.offers ? data.offers.filter(o => o.type === SCREEN_TYPE) : [];
            if (list.length) {
                box.innerHTML = '';
                list.forEach(o => {
                    const img = document.createElement('img');
                    img.className = 'slide';
                    img.src = o.url;
                    img.alt = o.title || '';
                    box.appendChild(img);
                });
            } // else: keep the built-in image(s) in the HTML as a fallback
            slides = box.querySelectorAll('.slide');
            currentSlide = 0;
            slides.forEach(s => s.classList.remove('active'));
            if (slides.length) slides[0].classList.add('active');
            clearInterval(timer);
            if (slides.length > 1) timer = setInterval(nextSlide, intervalTime);
        }

        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        (async () => {
            const data = await fetchOffers();
            liveVersion = data && data.version;
            buildSlides(data);
        })();

        // Swap in new offers as soon as they're published
        setInterval(async () => {
            const data = await fetchOffers();
            if (data && data.version && data.version !== liveVersion) {
                liveVersion = data.version;
                buildSlides(data);
            }
        }, CHECK_EVERY);

        // Full refresh every 6 hours to pick up any page changes
        setTimeout(() => location.reload(), 6 * 60 * 60 * 1000);
    </script>
</body>
</html>
